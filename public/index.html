<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>elijxhraz</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- animated background -->
  <div class="bg-wrapper">
    <img src="images/background.gif" class="bg-gif" alt="" />
  </div>

  <!-- floating sparkle particles -->
  <div class="particles" id="particles"></div>

  <!-- ── MAIN CARD ── -->
  <main class="card-wrapper">
    <div class="main-card glass">

      <!-- profile picture -->
      <div class="avatar-ring">
        <img src="images/circle.png" class="avatar" alt="elijxhraz" />
      </div>

      <!-- name -->
      <h1 class="username">elijxhraz</h1>

      <!-- status dot + bar -->
      <div class="status-row">
        <span class="status-dot"></span>
        <span class="status-bar"></span>
      </div>

      <!-- now-playing mini row -->
      <div class="now-playing-row">
        <div class="np-thumb">
          <img src="images/circle.png" alt="album art" />
        </div>
        <div class="np-info">
          <div class="np-title-bar"></div>
          <div class="np-artist-bar"></div>
        </div>
        <div class="np-actions">
          <span class="np-icon heart">🤍</span>
          <span class="np-divider"></span>
          <span class="np-icon shield">🛡️</span>
          <span class="np-dot"></span>
        </div>
      </div>

      <!-- social icons -->
      <nav class="socials">
        <a href="#" title="Wings">🪶</a>
        <a href="#" title="Bear">🐻</a>
        <a href="#" title="Roblox">
          <img src="images/roblox.png" class="social-img" id="roblox-icon" alt="Roblox" />
        </a>
        <a href="#" title="X / Twitter">✕</a>
        <a href="#" title="TikTok">
          <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.32 6.32 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/></svg>
        </a>
        <a href="#" title="Bear 2">🧸</a>
        <a href="#" title="Patreon">
          <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M14.82 2.41c3.96 0 7.18 3.24 7.18 7.21 0 3.96-3.22 7.18-7.18 7.18-3.97 0-7.21-3.22-7.21-7.18 0-3.97 3.24-7.21 7.21-7.21zM2 21.6h3.5V2.41H2V21.6z"/></svg>
        </a>
        <a href="#" title="Discord">
          <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        </a>
        <a href="#" title="Instagram">📷</a>
        <a href="#" title="Cat">🐱</a>
        <a href="#" title="Wings 2">🪶</a>
      </nav>

      <!-- view count -->
      <div class="view-count">
        <span class="eye">👁</span>
        <span class="count">8,259</span>
      </div>

    </div><!-- /.main-card -->

    <!-- ── MUSIC PLAYER CARD ── -->
    <div class="player-card glass">
      <div class="player-art">
        <img src="images/circle.png" alt="now playing" id="player-art-img" />
      </div>
      <div class="player-body">
        <div class="player-progress">
          <span class="player-scissors">✂</span>
          <div class="progress-track" id="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
        </div>
        <div class="player-times">
          <span class="time-current" id="time-current">0:20</span>
          <span class="time-total" id="time-total">1:49</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" id="btn-prev" title="Previous">⏮</button>
        <button class="ctrl-btn ctrl-play" id="btn-play" title="Play / Pause">⏸</button>
        <button class="ctrl-btn" id="btn-vol" title="Volume">🔊</button>
      </div>
    </div><!-- /.player-card -->

  </main>

  <script src="js/main.js"></script>
</body>
</html>
